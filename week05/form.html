<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form assignment submission confirmation">
    <meta name="author" content="Cameron Fay">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script defer src="scripts/form.js"></script>
</head>
<body>
    <header>
        <h1>Produt Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" id="form">
            <label>Product Name*<select name="product" id="products" required>
            <option value="" selected disabled>select a product</option>
            </select></label>
            <p>Overall Rating*</p>
            <div class="stars">
                <label><input value="1" type="radio" name="star" id="starsone" required>⁎</label>
                <label><input value="2" type="radio" name="star" id="starstwo" required>⁑</label>
                <label><input value="3" type="radio" name="star" id="starsthree" required>⁂</label>
                <label><input value="4" type="radio" name="star" id="starsfour" required>⁑⁑</label>
                <label><input value="5" type="radio" name="star" id="starsfive" required>*⁂*</label>
            </div>
            
            <label>Date of installation*<input type="date" name="installation" id="installation" required></label>
            
            <P id="checkboxlabel">Which features did you find useful in the product?<br> (Check all that apply)</p>
            <label><input type="checkbox" name="durabllity" id="durabllity" value="yes">Durabllity</label>
            <label><input type="checkbox" name="ease" id="ease" value="yes">Ease of Use</label>
            <label><input type="checkbox" name="performance" id="performance" value="yes">Performance</label>
            <label><input type="checkbox" name="design" id="design" value="yes">Design</label>
            <label>Written Review <textarea name="Review" id="Review"></textarea></label>
            <label>Your Name <input type="text" name="name" id="name" autocomplete="name"></label>
            <input type="submit" value="Post Review" id="button">
        </form>
    </main>
    <footer>
            <p>©<span id="currentyear"></span> - Cameron D. fay - Utah</p>
            <p id="lastModified">Last Modification: </p>
    </footer>
</body>
</html>
